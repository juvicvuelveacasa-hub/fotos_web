        <div class="form-group">
          <label for="zona">Número de zona</label>
          <!-- ARREGLO: Cambiado a type="number" y añadida validación -->
          <input type="number" id="zona" name="zona" required placeholder="Ej: 1, 2, 3..." inputmode="numeric" min="1">
        </div>
      </div>

      <!-- Registro Fotográfico -->
      <div class="form-section">
        <h2>Registro Fotográfico<script>
class PhotoFormManager {
  constructor() {
    this.form = document.getElementById('photoForm');
    this.imageInput = document.getElementById('imageInput');
    this.uploadArea = document.getElementById('uploadArea');
    this.imagePreview = document.getElementById('imagePreview');
    this.successModal = document.getElementById('successModal');
    this.loadingModal = document.getElementById('loadingModal');
    
    // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT CUANDO LA GENERES
    this.SCRIPT_URL = 'TU_NUEVA_URL_DE_APPS_SCRIPT_AQUI'; 
    
    this.selectedImages = [];
    this.maxImages = 20;
    this.maxFileSize = 5 * 1024 * 1024; // 5MB
    
    this.initializeEventListeners();
  }

  initializeEventListeners() {
    this.form.addEventListener('submit', (e) => this.handleSubmit(e));
    this.imageInput.addEventListener('change', (e) => this.handleFileSelect(e));
    this.uploadArea.addEventListener('dragover', (e) => this.handleDragOver(e));
    this.uploadArea.addEventListener('dragleave', (e) => this.handleDragLeave(e));
    this.uploadArea.addEventListener('drop', (e) => this.handleDrop(e));
    this.uploadArea.addEventListener('click', () => this.imageInput.click());
    
    document.getElementById('clearBtn').addEventListener('click', () => this.clearAll());
    document.getElementById('newForm').addEventListener('click', () => location.reload());
  }

  handleDragOver(e) { e.preventDefault(); this.uploadArea.classList.add('drag-over'); }
  handleDragLeave(e) { e.preventDefault(); this.uploadArea.classList.remove('drag-over'); }
  handleDrop(e) {
    e.preventDefault();
    this.uploadArea.classList.remove('drag-over');
    this.processFiles(Array.from(e.dataTransfer.files));
  }
  handleFileSelect(e) { this.processFiles(Array.from(e.target.files)); }

  processFiles(files) {
    const imageFiles = files.filter(file => file.type.startsWith('image/'));
    if (imageFiles.length === 0) { alert('Por favor selecciona solo archivos de imagen'); return; }
    if (this.selectedImages.length + imageFiles.length > this.maxImages) { alert(`Máximo ${this.maxImages} imágenes permitidas`); return; }

    imageFiles.forEach(file => {
      if (file.size > this.maxFileSize) { alert(`La imagen ${file.name} es muy grande (máximo 5MB)`); return; }
      this.addImage(file);
    });
  }

  addImage(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      this.selectedImages.push({
        file: file,
        data: e.target.result,
        type: file.type,
        name: file.name
      });
      this.renderImagePreview();
      this.updateUploadArea();
    };
    reader.readAsDataURL(file);
  }

  renderImagePreview() {
    this.imagePreview.innerHTML = '';
    if (this.selectedImages.length === 0) return;

    const header = document.createElement('h3');
    header.textContent = `Imágenes seleccionadas (${this.selectedImages.length})`;
    this.imagePreview.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'image-grid';

    this.selectedImages.forEach((image, index) => {
      grid.innerHTML += `
        <div class="image-card">
          <div class="image-wrapper">
            <img src="${image.data}" alt="${image.name}">
            <button type="button" class="remove-btn" onclick="photoManager.removeImage(${index})">×</button>
          </div>
          <div class="image-info">
            <p class="image-name">${image.name}</p>
            <p class="image-size">${(image.file.size / (1024*1024)).toFixed(2)} MB</p>
          </div>
        </div>`;
    });
    this.imagePreview.appendChild(grid);
  }

  removeImage(index) {
    this.selectedImages.splice(index, 1);
    this.renderImagePreview();
    this.updateUploadArea();
  }

  updateUploadArea() {
    const content = this.uploadArea.querySelector('.upload-content h3');
    content.textContent = this.selectedImages.length > 0 ? `${this.selectedImages.length} imagen(es) seleccionada(s)` : 'Arrastra las imágenes aquí';
  }

  async handleSubmit(e) {
    e.preventDefault();
    const liderInput = document.getElementById('lider').value;
    const zonaInput = document.getElementById('zona').value;

    if (!liderInput || !zonaInput || this.selectedImages.length === 0) {
      alert('Por favor complete líder, zona y suba al menos una imagen.');
      return;
    }

    this.loadingModal.style.display = 'block';
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    
    // ARREGLO: Envío individual de imágenes para evitar límites de tamaño
    let subfolderId = null; 

    try {
      for (let i = 0; i < this.selectedImages.length; i++) {
        progressText.textContent = `Subiendo imagen ${i + 1} de ${this.selectedImages.length}...`;
        const currentImage = this.selectedImages[i];
        
        // Paquete de datos liviano
        const currentData = {
          lider: liderInput,
          zona: zonaInput,
          currentImageIndex: i,
          totalImages: this.selectedImages.length,
          existingFolderId: subfolderId, // Pasar el ID de carpeta si ya se creó en el paso 1
          image: {
            data: currentImage.data,
            type: currentImage.type,
            name: currentImage.name
          }
        };

        // Enviar con mode: 'cors' para intentar leer la respuesta si Google lo permite
        // O text/plain y no-cors como fallback si los archivos son muy grandes y CORS preflight falla
        const response = await fetch(this.SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // text/plain evita bloqueos CORS en archivos pesados
          body: JSON.stringify(currentData)
        });

        // Actualizar barra de progreso (no podemos leer response.json con no-cors, asumimos éxito)
        // NOTA: Con no-cors no podemos obtener el subfolderId del backend, así que 
        // el backend tendrá que buscar o crear la carpeta cada vez basándose en el nombre de zona-líder.
        // He ajustado el script de Apps Script (Backend 2.0 arriba) para que maneje esto.
        
        progressFill.style.width = ((i + 1) / this.selectedImages.length * 100) + '%';
      }

      progressText.textContent = '¡Finalizando registro!';
      setTimeout(() => {
        this.loadingModal.style.display = 'none';
        this.successModal.style.display = 'block';
      }, 1000);
      
    } catch (error) {
      this.loadingModal.style.display = 'none';
      console.error('Error al enviar:', error);
      alert('Error al enviar las imágenes. Asegúrate de que las fotos no sean demasiado grandes y que tu conexión a internet sea estable. Intenta enviar menos imágenes a la vez para probar.');
    }
  }

  clearAll() {
    this.selectedImages = [];
    this.renderImagePreview();
    this.updateUploadArea();
    this.imageInput.value = '';
  }
}

let photoManager;
document.addEventListener('DOMContentLoaded', () => { photoManager = new PhotoFormManager(); });
</script>
